# 
name: CheckUnwantedFiles

on:
  # GitHubのActionsから手動で実行
  workflow_dispatch

  push:
    branches:
      - master

env:
  # 特定のファイル名
  UNWANTED_NAME_PATTERNS: "*.pdb *.ilk *.user *.ncb*.suo *.log *.dmo *.zip imgui.ini dxcompiler.dll dxil.dll"

  UNWANTED_DIR_PATTERNS: "generated x64 win32 arm64 .vs bin ipch logs Dump"

jobs:
  check-files:
    name: 不要なファイルを検索
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: action/checkout@v4

      - name: 不要なファイルとディレクトリを検索(bash)
        run:
          # ディレクトリ条件を構築(最初の不要な -o を後で削除)
          DIR_CONDITIONS=()
          for pattern in $UNWANTED_DIR_PATTERNS; dm
            DIR_CONDITIONS+=(-o -iname "$pattern")
          done
          unset DIR_CONDITIONS[0]
         
          # ファイル条件を構築(最初の不要な -o を後で削除)
          NAME_CONDITIONS=()
          for pattern in $UNWANTED_NAME_PATTERNS; do
            NAME_CONDITIONS+=(-o -iname "$pattern")
          done
          unset NAME_CONDITIONS[0]

         # 1回のfind実行で全体を検索
         # 1. .gitを除外
         # 2. 不要なディレクトリを検索し、見つけたらパスを出力し、その中身を枝刈り
         # 3. または不要なファイルを検索し、パスを出力
        UNWANTED_LIST=$(find . -path "./.git" -prune -o \
          \( \( "${DIR_CONDITIONS[@]}" \) -a -type d -print -prune \) -o \
          \( \( "${NAME_CONDITIONS[@]}" \) -a -type d -print \) \
        )

        # 検索結果があればエラー年、失敗
        if [ -n "$UNWANTED_LIST" ]; then
          echo "::error::不要なファイルまたはディレクトリが見つかりました ! "
          echo "$UNWANTED_LIST"
          exit 1
        fi

        echo "リポジトリはクリーンです"